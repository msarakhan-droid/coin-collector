<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Збирач монет</title><style>body{margin:0;background:#101827;color:#f8fafc;font-family:Arial,sans-serif;text-align:center}main{max-width:850px;margin:24px auto;padding:0 12px}h1{margin-bottom:8px}.hud{display:flex;justify-content:space-around;background:#243249;padding:15px;border-radius:12px;margin:12px 0}canvas{width:100%;max-width:800px;background:#18283c;border:2px solid #64748b;border-radius:12px;touch-action:none}button{padding:12px 22px;border:0;border-radius:9px;background:#22c55e;color:#07130a;font-weight:bold;cursor:pointer}p{color:#cbd5e1}</style></head><body><main><h1>🪙 Збирач монет</h1><p>Рухайся стрілками або WASD, збирай монети та уникай червоного ворога!</p><div class="hud"><span>Монети: <b id="score">0</b></span><span>Час: <b id="time">0</b> с</span><span>Швидкість ворога: <b id="speed">120</b> px/с</span></div><canvas id="game" width="800" height="480" tabindex="0" aria-label="Ігрове поле"></canvas><p id="status">Натисни «Почати гру»</p><button id="start">Почати гру / Заново</button><p>Після кожних 5 монет ворог прискорюється на 10 px/с. Дотик до ворога завершує гру.</p></main><script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');const scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),speedEl=document.querySelector('#speed'),statusEl=document.querySelector('#status');let player,enemy,coin,score=0,elapsed=0,playing=false,last=0,raf=0,audio;const keys=new Set();const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function spawnCoin(){let p;do{p={x:20+Math.random()*760,y:20+Math.random()*440,r:11}}while(dist(p,player)<75||dist(p,enemy)<65);return p}function sound(){try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const osc=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime;osc.type='sine';osc.frequency.setValueAtTime(650,t);osc.frequency.exponentialRampToValueAtTime(1000,t+.12);gain.gain.setValueAtTime(.12,t);gain.gain.exponentialRampToValueAtTime(.001,t+.16);osc.connect(gain).connect(audio.destination);osc.start(t);osc.stop(t+.17)}catch(e){}}function draw(){ctx.clearRect(0,0,800,480);ctx.strokeStyle='#2d4057';ctx.lineWidth=1;for(let x=0;x<800;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,480);ctx.stroke()}for(let y=0;y<480;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(800,y);ctx.stroke()}if(!player)return;ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(coin.x,coin.y,coin.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fef08a';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(enemy.x,enemy.y,enemy.r,0,Math.PI*2);ctx.fill();if(!playing){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,800,480);ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';ctx.fillText(score?'Гру завершено!':'Збирач монет',400,230);ctx.font='20px Arial';ctx.fillText('Натисни «Почати гру»',400,265)}}function end(){playing=false;statusEl.textContent=`Game Over! Зібрано монет: ${score}. Час: ${Math.floor(elapsed)} с.`;draw()}function tick(ts){if(!playing)return;let dt=Math.min((ts-last)/1000,.05);last=ts;elapsed+=dt;let dx=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0),dy=(keys.has('ArrowDown')||keys.has('s')?1:0)-(keys.has('ArrowUp')||keys.has('w')?1:0),m=Math.hypot(dx,dy)||1;player.x=clamp(player.x+dx/m*220*dt,player.r,800-player.r);player.y=clamp(player.y+dy/m*220*dt,player.r,480-player.r);const speed=120+10*Math.floor(score/5),ed=dist(enemy,player);if(ed>0){const step=Math.min(speed*dt,ed);enemy.x+=(player.x-enemy.x)/ed*step;enemy.y+=(player.y-enemy.y)/ed*step}if(dist(player,coin)<player.r+coin.r){score++;sound();coin=spawnCoin()}scoreEl.textContent=score;timeEl.textContent=Math.floor(elapsed);speedEl.textContent=120+10*Math.floor(score/5);if(dist(player,enemy)<player.r+enemy.r){end();return}draw();raf=requestAnimationFrame(tick)}function start(){cancelAnimationFrame(raf);keys.clear();player={x:110,y:240,r:16};enemy={x:690,y:240,r:20};score=0;elapsed=0;coin=spawnCoin();scoreEl.textContent=0;timeEl.textContent=0;speedEl.textContent=120;statusEl.textContent='Гра триває!';playing=true;last=performance.now();canvas.focus();draw();raf=requestAnimationFrame(tick)}document.querySelector('#start').addEventListener('click',start);document.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(k)){e.preventDefault();keys.add(k)}});document.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));window.addEventListener('blur',()=>keys.clear());player={x:110,y:240,r:16};enemy={x:690,y:240,r:20};coin={x:400,y:240,r:11};draw();
</script></body></html>
